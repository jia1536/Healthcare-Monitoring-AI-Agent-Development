<text x="490" y="126" text-anchor="middle" font-size="10.5" fill="#534ab7">keyword-based intent routing</text>

<line x1="410" y1="138" x2="150" y2="184" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="490" y1="138" x2="490" y2="184" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="570" y1="138" x2="830" y2="184" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

