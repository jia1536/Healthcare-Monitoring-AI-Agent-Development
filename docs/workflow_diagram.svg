<line x1="830" y1="360" x2="510" y2="360" stroke="#444" stroke-width="1"/>
<line x1="490" y1="360" x2="490" y2="392" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="330" y="392" width="320" height="60" rx="8" fill="#fff4e0" stroke="#d99a2b" stroke-width="1"/>
<text x="490" y="415" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d0a">finalize</text>
<text x="490" y="432" text-anchor="middle" font-size="10" fill="#8a5f16">detect_health_risks() + build_health_report()</text>
<text x="490" y="446" text-anchor="middle" font-size="9.5" fill="#8a5f16">writes alerts + health_reports rows</text>

<line x1="490" y1="452" x2="490" y2="486" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<circle cx="490" cy="510" r="24" fill="#1a1a1a"/>
<text x="490" y="515" text-anchor="middle" fill="#fff" font-size="13">END</text>

<text x="30" y="600" font-size="12" fill="#333" font-weight="600">Shared state (AgentState):</text>
<text x="30" y="620" font-size="11" fill="#555">messages (chat history) · patient_id · route · health_report · alerts_raised</text>
<text x="30" y="645" font-size="12" fill="#333" font-weight="600">Data layer:</text>
<text x="30" y="665" font-size="11" fill="#555">SQLite (App/db/database.py) — patients, medications, medication_logs,</text>
<text x="30" y="682" font-size="11" fill="#555">fitness_logs, health_goals, alerts, health_reports</text>
</svg>
