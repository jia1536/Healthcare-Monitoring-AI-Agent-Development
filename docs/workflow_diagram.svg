<rect x="30" y="184" width="240" height="50" rx="8" fill="#e6f1fb" stroke="#378ade" stroke-width="1"/>
<text x="150" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#042c53">medical_info</text>
<text x="150" y="221" text-anchor="middle" font-size="10" fill="#185fa5">Groq LLM + RAG tool</text>
<line x1="150" y1="234" x2="150" y2="266" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="30" y="266" width="240" height="46" rx="8" fill="#eaf7ee" stroke="#3aa662" stroke-width="1"/>
<text x="150" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#124a25">medical_tools</text>
<text x="150" y="302" text-anchor="middle" font-size="9.5" fill="#1f7a3c">search_health_documents</text>
<path d="M270 289 C 310 289, 310 209, 271 209" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="330" y="255" font-size="9.5" fill="#777">loop until final</text>

<!-- Medication column -->
<rect x="370" y="184" width="240" height="50" rx="8" fill="#e6f1fb" stroke="#378ade" stroke-width="1"/>
<text x="490" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#042c53">medication</text>
<text x="490" y="221" text-anchor="middle" font-size="10" fill="#185fa5">Groq LLM + medication tools</text>
<line x1="490" y1="234" x2="490" y2="266" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="370" y="266" width="240" height="46" rx="8" fill="#eaf7ee" stroke="#3aa662" stroke-width="1"/>
<text x="490" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#124a25">medication_tools</text>
<text x="490" y="302" text-anchor="middle" font-size="9.5" fill="#1f7a3c">add / log dose / adherence / interactions</text>
<path d="M610 289 C 650 289, 650 209, 611 209" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="670" y="255" font-size="9.5" fill="#777">loop until final</text>

<!-- Fitness column -->
<rect x="710" y="184" width="240" height="50" rx="8" fill="#e6f1fb" stroke="#378ade" stroke-width="1"/>
<text x="830" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#042c53">fitness</text>
<text x="830" y="221" text-anchor="middle" font-size="10" fill="#185fa5">Groq LLM + fitness tools</text>
<line x1="830" y1="234" x2="830" y2="266" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="710" y="266" width="240" height="46" rx="8" fill="#eaf7ee" stroke="#3aa662" stroke-width="1"/>
<text x="830" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#124a25">fitness_tools</text>
<text x="830" y="302" text-anchor="middle" font-size="9.5" fill="#1f7a3c">log entry / trend summary / goals</text>
<path d="M950 289 C 990 289, 990 209, 951 209" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
